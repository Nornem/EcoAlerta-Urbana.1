<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Vecinal - EcoAlerta Urbana</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/auth.css">
  <!-- Vinculación del script con defer -->
  <script src="../js/auth.js" defer></script>
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="../images/LogoEcoAlerta.png" alt="Logo" width="60">
        <h1>EcoAlerta</h1>
        <p>Acceso Vecinal</p>
      </div>

      <!-- Contenedor para mensajes globales de confirmación/error -->
      <div id="alert-message" class="alert-message hidden"></div>

      <!-- Se agrega novalidate al formulario -->
      <form id="login-form" class="auth-form" novalidate>
        <button type="button" id="btn-google" class="btn-google">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" width="18">
          Continuar con Google
        </button>

        <div class="divider">
          <span>O ingresa con correo</span>
        </div>

        <div class="form-group">
          <!-- Campo obligatorio identificado claramente con asterisco (*) -->
          <label for="email">Correo electrónico <span class="required">*</span></label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
          <span class="error-text" id="email-error"></span>
        </div>

        <div class="form-group">
          <!-- Campo obligatorio identificado claramente con asterisco (*) -->
          <label for="password">Contraseña <span class="required">*</span></label>
          <input type="password" id="password" placeholder="********" required>
          <span class="error-text" id="password-error"></span>
        </div>

        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

        <button type="submit" class="boton boton-full">Ingresar</button>
      </form>

      <p class="auth-footer">
        ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
      </p>
    </div>
  </div>
</body>
</html>
